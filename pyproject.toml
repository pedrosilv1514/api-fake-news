[tool.poetry]
name = "fakenews-hub"
version = "0.1.0"
description = "Hub de verificação de notícias: API em tempo real (extração + NLP + cache)."
readme = "README.md"
package-mode = true
packages = [
    { include = "api" },
    { include = "scraper" },
    { include = "ml" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "0.142.2"
uvicorn = { version = "0.54.0", extras = ["standard"] }
sqlalchemy = { version = "2.1.3", extras = ["asyncio"] }
psycopg2-binary = ">=2.9.10"
trafilatura = "2.3.0"
httpx = "^0.28.1"
alembic = "^1.20.0"
asyncpg = "^0.31.0"
scikit-learn = "1.9.1"
joblib = "1.6.0"
numpy = "2.5.3"
nltk = "3.10.3"
pandas = "3.0.6"
aiosqlite = "0.22.1"
certifi = "2026.7.22"
lxml = "6.1.3"
tld = "0.13.2"

[tool.poetry.group.bias]
optional = true

[tool.poetry.group.bias.dependencies]
torch = "2.14.1"
transformers = "5.19.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
